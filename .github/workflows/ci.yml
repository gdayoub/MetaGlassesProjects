name: Local application checks
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    working-directory: Lensly
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check apps/backend
      - run: uv run mypy
      - run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm install --frozen-lockfile
        working-directory: Lensly/apps/web
      - run: pnpm run build
        working-directory: Lensly/apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: Lensly/apps/web
      - run: pnpm test
        working-directory: Lensly/apps/web
