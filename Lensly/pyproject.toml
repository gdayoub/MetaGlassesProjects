[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "lensagent"
version = "0.1.0"
description = "Private local text and image assistant foundation for wearable interfaces"
requires-python = ">=3.12,<3.16"
dependencies = [
  "fastapi==0.159.1",
  "uvicorn>=0.35,<1",
  "google-genai==2.32.0",
  "httpx>=0.28,<1",
  "pillow==13.0.0",
  "python-multipart>=0.0.22,<1",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1", "mypy>=1.16,<2", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["apps/backend/src"]

[tool.pytest.ini_options]
testpaths = ["apps/backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["apps/backend/src"]
strict = true
